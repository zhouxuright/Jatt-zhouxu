# =============================================================================
# Legal Intelligent Assistance System - Nginx Configuration (Production)
# =============================================================================
# Production reverse proxy with:
# - SSE streaming support (proxy_buffering off)
# - Load balancing across multiple backend instances
# - Gzip compression
# - Security headers
# - Static file caching
# =============================================================================

upstream backend_pool {
    least_conn;  # Route to backend with fewest active connections
    server backend:8001;
    # Add more backends for horizontal scaling:
    # server backend-2:8001;
    # server backend-3:8001;
}

server {
    listen 80;
    server_name localhost;

    # -------------------------------------------------------------------------
    # Gzip compression
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json
        application/x-javascript
        image/svg+xml;

    # -------------------------------------------------------------------------
    # Security headers
    # -------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # microphone=(self) is required: the chat page's voice input uses the
    # browser Web Speech API. The previous `microphone=()` disabled the
    # microphone outright, so the voice button could never work in production
    # even though the UI offered it.
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

    # -------------------------------------------------------------------------
    # SSE streaming endpoint (MUST disable buffering)
    # -------------------------------------------------------------------------
    location /api/v1/chat/chat/stream {
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;

        # Critical: disable all buffering for real-time streaming
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Long timeout for streaming (LLM responses can take minutes)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';

        # Request body size
        client_max_body_size 50M;
    }

    # -------------------------------------------------------------------------
    # API proxy to backend pool
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        # 600s：合同审查等 AI 端点会对长文档逐条调用大模型，分钟级属正常。
        # 原先 120s 会让长文本审查被掐断成 504，前端只显示"请求失败"。
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # File upload size
        client_max_body_size 50M;
    }

    # -------------------------------------------------------------------------
    # Health check (direct to backend, no load balancing needed)
    # -------------------------------------------------------------------------
    location /health {
        proxy_pass http://backend_pool/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # -------------------------------------------------------------------------
    # Static frontend assets (long cache)
    #
    # `expires` sets Cache-Control itself, so no `add_header` is needed here.
    # Declaring `add_header` inside a location discards *every* add_header
    # inherited from the enclosing server block — nginx does not merge them.
    # The explicit `Cache-Control "public, immutable"` that used to sit here
    # therefore also stripped nosniff from every JS/CSS response.
    # -------------------------------------------------------------------------
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        access_log off;
    }

    # -------------------------------------------------------------------------
    # SPA fallback - all other routes serve index.html
    # -------------------------------------------------------------------------
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # `expires -1` emits "Cache-Control: no-cache" without add_header, so the
        # security headers declared at server level still apply. This block used
        # to call add_header, which is why live responses for the HTML document
        # carried no X-Frame-Options / nosniff / Referrer-Policy /
        # Permissions-Policy at all.
        location = /index.html {
            expires -1;
        }
    }

    # -------------------------------------------------------------------------
    # Deny access to hidden files
    # -------------------------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # -------------------------------------------------------------------------
    # Error pages
    # -------------------------------------------------------------------------
    error_page 502 503 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
