# =============================================================================
# Legal Intelligent Assistance System - Nginx Configuration (Production)
# =============================================================================
# Production reverse proxy with:
# - SSE streaming support (proxy_buffering off)
# - Load balancing across multiple backend instances
# - Gzip compression
# - Security headers
# - Static file caching
# =============================================================================

# Docker 内置 DNS（127.0.0.11）：让 `backend` 在运行期定期重新解析。
# 若只在启动时解析一次（`server backend:8001;` 的老写法），backend 容器被
# 重建后 IP 会变化，而本容器仍指向已消失的旧 IP —— 表现为前端整片接口返
# 回 502（"Failed to load conversations: AxiosError 502"）。重建/发布期间
# 必然出现该窗口，故必须动态解析。
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

upstream backend_pool {
    least_conn;  # Route to backend with fewest active connections
    zone backend_pool 64k;
    server backend:8001 resolve;
    # Add more backends for horizontal scaling:
    # server backend-2:8001;
    # server backend-3:8001;
    keepalive 32;  # Reuse upstream connections instead of a new TCP handshake per request
}

server {
    listen 80;
    server_name localhost;

    # -------------------------------------------------------------------------
    # Gzip compression
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json
        application/x-javascript
        image/svg+xml;

    # -------------------------------------------------------------------------
    # Security headers
    # -------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # microphone=(self) is required: the chat page's voice input uses the
    # browser Web Speech API. The previous `microphone=()` disabled the
    # microphone outright, so the voice button could never work in production
    # even though the UI offered it.
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

    # -------------------------------------------------------------------------
    # SSE / long-lived streaming endpoints (MUST disable buffering)
    #
    # Previously only /api/v1/chat/chat/stream disabled buffering. Deep reasoning
    # (/api/v1/reasoning/deep-think/stream) and streaming skill execution
    # (/api/v1/skills/execute-stream) fell through to the generic /api/ block and
    # were buffered — the UI showed nothing for a long time, then one big burst.
    # A regex location wins over the prefix /api/ block, so this overrides it.
    # -------------------------------------------------------------------------
    location ~ ^/api/v1/(reasoning/deep-think/stream|skills/execute-stream|data/pipeline/run|chat/chat/stream|chat/voice) {
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;

        # Critical: disable all buffering for real-time streaming
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Long timeout for streaming (LLM responses can take minutes)
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';

        # 上游短暂不可用（如某副本重启）时自动重试下一个地址，避免直接抛 502
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;

        # Request body size
        client_max_body_size 50M;
    }

    # -------------------------------------------------------------------------
    # API proxy to backend pool
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 之前这里是 Upgrade / Connection "upgrade"：普通 REST 请求也被要求
        # 升级连接，既让上游 keepalive 连接池失效，部分客户端还会因此挂住。
        # 真正需要 WebSocket 的端点请单独开 location 处理。
        proxy_set_header Connection "";

        # Timeouts
        # 600s：合同审查等 AI 端点会对长文档逐条调用大模型，分钟级属正常。
        # 原先 120s 会让长文本审查被掐断成 504，前端只显示"请求失败"。
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # 上游短暂不可用（如某副本重启）时自动重试下一个地址，避免直接抛 502
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;

        # File upload size
        client_max_body_size 50M;
    }

    # -------------------------------------------------------------------------
    # Health check (direct to backend, no load balancing needed)
    # -------------------------------------------------------------------------
    location /health {
        proxy_pass http://backend_pool/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # -------------------------------------------------------------------------
    # Static frontend assets (long cache)
    #
    # `expires` sets Cache-Control itself, so no `add_header` is needed here.
    # Declaring `add_header` inside a location discards *every* add_header
    # inherited from the enclosing server block — nginx does not merge them.
    # The explicit `Cache-Control "public, immutable"` that used to sit here
    # therefore also stripped nosniff from every JS/CSS response.
    # -------------------------------------------------------------------------
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        access_log off;
    }

    # -------------------------------------------------------------------------
    # SPA fallback - all other routes serve index.html
    # -------------------------------------------------------------------------
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # `expires -1` emits "Cache-Control: no-cache" without add_header, so the
        # security headers declared at server level still apply. This block used
        # to call add_header, which is why live responses for the HTML document
        # carried no X-Frame-Options / nosniff / Referrer-Policy /
        # Permissions-Policy at all.
        location = /index.html {
            expires -1;
        }
    }

    # -------------------------------------------------------------------------
    # Deny access to hidden files
    # -------------------------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # -------------------------------------------------------------------------
    # Error pages
    # -------------------------------------------------------------------------
    error_page 502 503 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
