# A generic, single database configuration.

[alembic]
# path to migration scripts
# Use a forward slash for compatibility across platforms
script_location = alembic

# database URL - used by offline mode; online mode also reads DATABASE_URL env var
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/legal_assistant

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
